[project]
name = "energy-recovery"
version = "0.1.0"
description = "Energy Invoice Recovery Engine — auditable reconciliation of Dutch business energy invoices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "defusedxml>=0.7",  # openpyxl uses it automatically against XML attacks (XXE, billion laughs)
    "reportlab>=4.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
ai = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
# SVG path data; Markup is built only from constants and escape()d values
"app/web/icons.py" = ["E501", "S704"]
"app/web/view.py" = ["S704"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
