{% extends "app_base.html" %}
{% from "_macros.html" import csrf_field with context %}
{% block title %}Inloggen{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Inloggen</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    {{ csrf_field() }}
    <label for="email">E-mailadres</label><input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Wachtwoord</label><input id="password" name="password" type="password" required autocomplete="current-password">
    <div class="actions mt"><button class="btn" type="submit">Inloggen</button></div>
  </form>
</div>
{% endblock %}
